# Format and level of the SLF4J log lines (slf4j-simple). Each line looks like:
#   19:42:07.318 [TestNG-PoolService-2] INFO CustomerApi - POST http://127.0.0.1:8000/customers -> 201
# The thread name tells parallel scenarios apart. Lines go to System.err, so RunLog also copies them into
# target/logs/run.log. Change a level for one run with -Dorg.slf4j.simpleLogger.defaultLogLevel=debug.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=false
# More detail from the framework's own classes only, for example:
# org.slf4j.simpleLogger.log.com.agenticqa=debug
