# Extent Spark report, written by the Extent Cucumber adapter (plugin in TestRunner).
extent.reporter.spark.start=true
extent.reporter.spark.out=target/reports/extent/index.html
extent.reporter.spark.config=src/test/resources/extent-config.xml
# screenshots are embedded in the HTML, so the report is one file that can be mailed or archived
extent.reporter.spark.base64imagesrc=true
screenshot.dir=target/reports/extent/screenshots/
screenshot.rel.path=screenshots/
