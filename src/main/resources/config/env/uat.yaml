# UAT (user acceptance) environment. Run: mvn test -Denv=uat
#
# The URLs below are placeholders: replace the fallbacks with the real uat hosts, or set the variables in CI.
# ${NAME} is filled from the system property NAME (-DNAME=...) or else the environment variable NAME;
# ${NAME:-fallback} uses the fallback when neither is set. Keep secrets (API keys, passwords) out of this file:
# reference them as ${NAME} and set them as CI secrets.
ui:
  baseUrl: ${UAT_UI_URL:-https://uat.customers.example.com}
  browser: chromium
  headless: true
  slowMoMs: 0
  timeoutMs: 30000
api:
  baseUrl: ${UAT_API_URL:-https://uat-api.customers.example.com}
  timeoutMs: 30000
# Every HTTP service the tests talk to, by name. Feature files and endpoint files (src/main/resources/endpoints)
# address a service by this name. Override a URL per run with -Dservices.customers.baseUrl=http://...
services:
  customers:
    baseUrl: ${UAT_CUSTOMERS_URL:-https://uat-api.customers.example.com}
    timeoutMs: 30000
    headers:
      Accept: application/json
      # X-Api-Key: ${UAT_CUSTOMERS_API_KEY}
  # orders:
  #   baseUrl: ${UAT_ORDERS_URL:-https://uat-api.orders.example.com}
  #   headers:
  #     X-Api-Key: ${UAT_ORDERS_API_KEY}
healing:
  enabled: true
  probeTimeoutMs: 2000
  minScore: 0.6
  fingerprintsFile: healing/fingerprints.json
  reportFile: target/healing/heals.jsonl
# Failed scenarios run again, right away; passed ones never do. count 0 switches retries off.
# tags is a Cucumber tag expression choosing which scenarios may be retried ("" = all).
# Override per run: -Dretry.count=2 -Dretry.tags="@api and not @noretry"
retry:
  count: 2
  tags: "not @noretry"
