# Local development. Run: mvn test (dev is the default). Shared settings are in config/common.yaml;
# this file holds only what differs here and wins over common.yaml.
ui:
  baseUrl: http://127.0.0.1:8000
  headless: false            # watch the browser locally
api:
  baseUrl: http://127.0.0.1:8000
# Every HTTP service the tests talk to, by name. The endpoint catalog (endpoints: in common.yaml) addresses a
# service by this name. Override a URL per run with -Dservices.customers.baseUrl=http://...
services:
  customers:
    baseUrl: http://127.0.0.1:8000
    # The local sample app needs no login. A service that does gets an auth section, for example:
    # auth:
    #   type: oauth2                       # none, oauth2 (client credentials), basic or bearer
    #   tokenUrl: http://127.0.0.1:9000/oauth2/token
    #   clientId: ${DEV_CUSTOMERS_CLIENT_ID:-local-client}
    #   clientSecret: ${DEV_CUSTOMERS_CLIENT_SECRET:-local-secret}
    #   scope: customers.read customers.write
