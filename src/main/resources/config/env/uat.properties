# UAT (user acceptance) environment. Run: mvn test -Denv=uat
# Holds only what differs from config/common.properties.
# The URL is a placeholder: replace the fallback with the real uat host, or set UAT_UI_URL in CI.
ui.baseUrl=${UAT_UI_URL:-https://uat.customers.example.com}
gui.klm.url=${UAT_KLM_URL:-https://klm.uat.example.com}
gui.gsn.url=${UAT_GSN_URL:-https://gsn.uat.example.com}
ui.waits.actionMs=30000
ui.waits.navigationMs=60000
ui.waits.assertionMs=30000
retry.count=2
