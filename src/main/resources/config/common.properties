# Settings shared by every environment. The environment file (config/env/NAME.properties, chosen with -Denv=NAME)
# is loaded on top of this file: a key set there wins, everything else comes from here.
# Any key can be overridden for one run with -D, for example -Dui.headless=false.
# Placeholders: ${NAME} is the system property NAME or else the environment variable NAME;
# ${NAME:-fallback} uses the fallback when neither is set.

# Default environment when neither -Denv nor the ENV variable is set
environment=dev

url.feature=kl-mmknbj-cd
url.klmhh=jhshdajh

cloud=testcould

# Folder of the test data files of the "the test data is" step (TestDataSetup). Per run: -Dtestdata.dir=...
testdata.dir=src/test/resources/testdata/

# ---------------------------------------------------------------- browser
# chromium, firefox or webkit
ui.browser=chromium
ui.headless=true
# delay per browser action, for watching a run
ui.slowMoMs=0
ui.viewport.width=1366
ui.viewport.height=768
# true: real window size, maximized (headed runs only)
ui.maximize=false
# Permissions granted to every page and new window, so no "Allow / Block" prompt appears (comma separated).
# Chromium names: notifications, geolocation, camera, microphone, clipboard-read, clipboard-write, midi,
# background-sync, payment-handler, storage-access. Grant only what the app asks for: an extra permission can
# change how the app behaves (with notifications, geolocation and clipboard granted, Add Master did nothing).
# Empty = grant nothing.
ui.permissions=
# true only for environments with self-signed certificates
ui.ignoreHttpsErrors=false
# off | failed (keep videos of failed scenarios) | always
ui.video=failed
# How long Playwright waits before it gives up (milliseconds)
ui.waits.actionMs=15000
ui.waits.navigationMs=30000
ui.waits.assertionMs=15000
# KlmPage / GsnPage: how long open() waits for the page (DOMContentLoaded) and for the login input to be visible
gui.openTimeoutMs=30000
gui.loginInputTimeoutMs=15000

# ---------------------------------------------------------------- ActiveMQ (MqUtil)
# false: @mq scenarios are skipped (no broker). Turn on with MQ_ENABLED=true or -Dmq.enabled=true
mq.enabled=${MQ_ENABLED:-false}
# Broker URL, e.g. tcp://host:61616 or ssl://host:61617. Keep the password in an environment variable.
mq.url=${MQ_URL:-tcp://localhost:61616}
mq.username=${MQ_USERNAME:-admin}
mq.password=${MQ_PASSWORD:-admin}
mq.outQueue=${MQ_OUT_QUEUE:-OUT.QUEUE}
# How long a read waits for the next message (milliseconds)
mq.receiveTimeoutMs=2000

# ---------------------------------------------------------------- execution
# parallel or sequential, for scenarios tagged neither @Parallel nor @Sequential
execution.defaultMode=parallel

# ---------------------------------------------------------------- cleanup
# Folders emptied before a run starts (comma separated). Per run: -Dcleanup.beforeRun=false
cleanup.beforeRun=true
cleanup.folders=target/reports,target/allure-results,target/artifacts,target/healing,target/logs
# Everything printed during the run is also written here
cleanup.logFile=target/logs/run.log

# ---------------------------------------------------------------- healing
healing.enabled=true
healing.probeTimeoutMs=2000
healing.minScore=0.6
healing.fingerprintsFile=healing/fingerprints.json
healing.reportFile=target/healing/heals.jsonl

# ---------------------------------------------------------------- retry
# Failed scenarios run again right away; 0 switches retries off.
# tags: Cucumber tag expression choosing which scenarios may be retried (empty = all)
retry.count=0
retry.tags=not @noretry
