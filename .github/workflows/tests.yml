name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each entry is its own job with its own app instance. Add a suite by adding its Cucumber tag here.
        suite: [ api, ui ]

    env:
      # The sample app lives in its own repository. Set the repository variable SAMPLE_APP_REPO
      # (Settings > Secrets and variables > Actions > Variables), for example my-org/sample-target-app.
      # If that repository is private, also add a secret SAMPLE_APP_TOKEN with read access to it.
      SAMPLE_APP_REPO: ${{ vars.SAMPLE_APP_REPO || 'YOUR_ORG/sample-target-app' }}
      APP_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Checkout sample app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SAMPLE_APP_REPO }}
          token: ${{ secrets.SAMPLE_APP_TOKEN || github.token }}
          path: sample-target-app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Start sample app
        working-directory: sample-target-app
        run: |
          uv sync
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs "$APP_URL/openapi.json" > /dev/null; then echo "App is up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::Sample app did not start within 60 s"
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=playwright.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system libraries
        if: matrix.suite == 'ui'
        run: >
          mvn -B -q org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Run ${{ matrix.suite }} tests
        run: mvn -B test -Denv=ci -Dcucumber.filter.tags="@${{ matrix.suite }}"

      # Allure HTML from target/allure-results into target/reports/allure (the plugin downloads the Allure CLI).
      # Extent (target/reports/extent) and the run summary are written by the test run itself.
      - name: Build Allure report
        if: always()
        continue-on-error: true
        run: mvn -B -q allure:report

      - name: Write job summary
        if: always()
        run: python3 .github/scripts/job_summary.py target/reports/run-summary.json "${{ matrix.suite }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.suite }}
          path: |
            target/reports/
            target/allure-results/
            target/healing/
            healing/fingerprints.json
          if-no-files-found: ignore

      - name: Upload traces of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.suite }}
          path: target/artifacts/traces/
          if-no-files-found: ignore

      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log-${{ matrix.suite }}
          path: ${{ runner.temp }}/app.log
          if-no-files-found: ignore
